# Developer and CI tool versions. Install with `mise install`,
# compare against your PATH with `make check-tools`.
[tools]
golang = "1.27.0"
golangci-lint = "2.13.2"
helm = "3.21.4"
helm-ct = "3.14.0"
helm-docs = "1.14.2"
ko = "0.17.1"
kube-controller-tools = "0.21.0"
yamlfmt = "0.21.0"
yq = "4.53.6"
# ct lint shells out to both.
yamllint = "1.33.0"
"pipx:yamale" = "6.0.0"

[settings]
# Enforce for supply chain security
lockfile = true
locked = true
