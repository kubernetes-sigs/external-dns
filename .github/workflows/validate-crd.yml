name: Validate CRD Generation

# A controller-gen bump changes generated output, so it must land with the
# regenerated files in the same PR.

on:
  pull_request:
    paths:
      - 'mise.toml'
      - 'scripts/generate-crd.sh'
      - '**/dnsendpoints.externaldns.k8s.io.yaml'

permissions:
  contents: read

jobs:
  validate-crd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up dev environment
        uses: ./.github/actions/dev-env
        with:
          cache-scope: validate-crd

      - name: Regenerate CRDs
        run: ./scripts/generate-crd.sh

      - name: Check for uncommitted changes
        id: check_changes
        run: |
          # Check if there are any changes to generated files
          if ! git diff --quiet; then
            echo "::error::Generated CRD files are out of sync with mise.toml"
            echo ""
            echo "The following files have uncommitted changes after running 'make crd':"
            git diff .
            echo ""
            echo "This usually means:"
            echo "1. mise.toml was updated (new controller-gen version)"
            echo "2. The generated CRD files were not regenerated"
            echo ""
            echo "To fix this:"
            echo "  make crd"
            echo "  git diff ."
            echo "  commit, push and update your PR:"
            exit 1
          fi

      - name: Success
        if: success()
        run: |
          echo "✅ Generated CRD files are up-to-date"
