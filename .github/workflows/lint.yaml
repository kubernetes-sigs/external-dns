name: Lint

on:
  pull_request:
    branches: [ master ]

permissions: {}

jobs:
  lint:
    name: Markdown and Go
    runs-on: ubuntu-latest
    permissions:
      # Required: allow read access to the content for analysis.
      contents: read
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Lint markdown
      uses: nosborn/github-action-markdown-cli@508d6cefd8f0cc99eab5d2d4685b1d5f470042c1 # v3.5.0
      with:
        files: '.'
        config_file: ".markdownlint.json"

    - name: Set up dev environment
      uses: ./.github/actions/dev-env
      with:
        cache-scope: lint

    - name: Check tools match mise.toml
      run: ./scripts/check-tools.sh --strict

    - name: Go formatting
      run: |
        if [ -z "$(gofmt -l .)" ]; then
          echo -e "All '*.go' files are properly formatted."
        else
          echo -e "Please run 'make go-lint' to fix. Some files need formatting:"
          gofmt -d -l .
          exit 1
        fi

    - name: Verify linter configuration and Lint go code
      run: make lint

    - name: Run file hygiene checks
      run: ./scripts/file-hygiene.sh

  check-go-version:
    name: Go version consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # For yq, pinned rather than whatever the runner image ships.
    - name: Set up dev environment
      uses: ./.github/actions/dev-env
      with:
        cache-scope: go-version

    - name: Check Go version consistency across cloudbuild.yaml, go.mod and mise.toml
      run: ./scripts/go-version-consistency.sh
