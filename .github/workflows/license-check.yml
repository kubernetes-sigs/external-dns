name: License Check

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'go.tool.mod'
      - 'go.tool.sum'
      - '.licenserc.yaml'
      - '.github/workflows/license-check.yml'

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # https://github.com/apache/skywalking-eyes
      - name: Install license-eye
        run: go install github.com/apache/skywalking-eyes/cmd/license-eye@v0.9.0

      - name: Check dependency licenses
        run: license-eye -c .licenserc.yaml dependency check -w
