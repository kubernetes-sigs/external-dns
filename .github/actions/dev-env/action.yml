name: 'dev-env'
description: 'Install the tools pinned in mise.toml and restore the Go caches'

inputs:
  cache-scope:
    description: 'Suffix for the Go cache key, keeps per-job caches separate'
    required: true
  mise-version:
    description: 'mise CLI version'
    required: false
    # renovate: datasource=github-releases depName=jdx/mise
    default: '2026.8.14'

runs:
  using: 'composite'
  steps:
    # Caches ~/.local/share/mise itself, so the tools are not in the cache below.
    - name: Install tools from mise.toml
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: ${{ inputs.mise-version }}

    # Both OS layouts: ci.yaml also runs on macos-latest.
    - name: Cache Go modules, build cache and lint cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/.cache/golangci-lint
          ~/Library/Caches/go-build
          ~/Library/Caches/golangci-lint
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-${{ hashFiles('go.sum', 'mise.lock') }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-
