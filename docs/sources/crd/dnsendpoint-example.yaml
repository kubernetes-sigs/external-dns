apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: examplednsrecord
spec:
  endpoints:
  - dnsName: foo.bar.com
    recordTTL: 180
    recordType: A
    targets:
    - 192.168.99.216
    # Provider specific configurations use "<provider>/<attribute>" format
    providerSpecific:
      - name: cloudflare/proxied
        value: "true"
