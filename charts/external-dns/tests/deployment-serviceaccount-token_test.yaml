suite: Deployment service account token
set:
  policy: upsert-only
templates:
  - deployment.yaml
release:
  namespace: default
tests:
  - it: should not add a token volume by default
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[?(@.name == "external-dns")].volumeMounts

  - it: should mount a projected token when automountServiceAccountToken is false
    set:
      automountServiceAccountToken: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - contains:
          path: spec.template.spec.containers[?(@.name == "external-dns")].volumeMounts
          content:
            name: kube-api-access
            mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kube-api-access
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3607
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - key: ca.crt
                        path: ca.crt
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          apiVersion: v1
                          fieldPath: metadata.namespace

  - it: should keep secret and extra volumes next to the token volume
    set:
      automountServiceAccountToken: false
      secretConfiguration:
        enabled: true
        mountPath: /etc/secrets
        data:
          key: value
      extraVolumes:
        - name: extra
          emptyDir: {}
      extraVolumeMounts:
        - name: extra
          mountPath: /extra
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 3
      - lengthEqual:
          path: spec.template.spec.containers[?(@.name == "external-dns")].volumeMounts
          count: 3

  - it: should not mount the token into the webhook sidecar
    set:
      automountServiceAccountToken: false
      provider:
        name: webhook
        webhook:
          image:
            repository: example/webhook
            tag: v1.0.0
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "external-dns")].volumeMounts
          content:
            name: kube-api-access
            mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            readOnly: true
      - notExists:
          path: spec.template.spec.containers[?(@.name == "webhook")].volumeMounts

  - it: should not add a token volume when extraVolumeMounts already mounts the token path
    set:
      automountServiceAccountToken: false
      extraVolumes:
        - name: my-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
      extraVolumeMounts:
        - name: my-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: kube-api-access
      - lengthEqual:
          path: spec.template.spec.containers[?(@.name == "external-dns")].volumeMounts
          count: 1
