suite: Service configuration
set:
  policy: upsert-only
templates:
  - service.yaml
release:
  namespace: default
tests:
  - it: should provide a single service by default
    asserts:
      - isKind:
            of: Service
      - hasDocuments:
          count: 1
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 7979

  - it: should provide a way to disable the service
    set:
      service:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should expose the webhook source port when sources contains webhook
    set:
      sources:
        - webhook
      webhookSource:
        image:
          repository: example.com/source-webhook
          tag: v1.0.0
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 2
      - contains:
          path: spec.ports
          content:
            name: http-source
            port: 8081
            targetPort: http-source
            protocol: TCP
