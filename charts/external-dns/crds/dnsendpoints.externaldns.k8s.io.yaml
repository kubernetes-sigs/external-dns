apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.kubernetes.io: https://github.com/kubernetes-sigs/external-dns/pull/2007
  name: dnsendpoints.externaldns.k8s.io
spec:
  group: externaldns.k8s.io
  names:
    kind: DNSEndpoint
    listKind: DNSEndpointList
    plural: dnsendpoints
    singular: dnsendpoint
  scope: Namespaced
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            DNSEndpoint is a contract that a user-specified CRD must implement to be used as a source for external-dns.
            The user-specified CRD should also have the status sub-resource.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: DNSEndpointSpec defines the desired state of DNSEndpoint
              properties:
                endpoints:
                  description: Endpoints is the list of DNS records this resource declares.
                  items:
                    description: Endpoint is a high-level way of a connection between a service and an IP
                    properties:
                      dnsName:
                        description: DNSName is the hostname of the DNS record.
                        maxLength: 253
                        minLength: 1
                        pattern: ^(\*\.)?([a-zA-Z0-9_]([-a-zA-Z0-9_]{0,61}[a-zA-Z0-9_])?\.)*[a-zA-Z0-9_]([-a-zA-Z0-9_]{0,61}[a-zA-Z0-9_])?\.?$
                        type: string
                      labels:
                        additionalProperties:
                          type: string
                        description: Labels stores labels defined for the Endpoint
                        type: object
                      providerSpecific:
                        description: ProviderSpecific stores provider specific config
                        items:
                          description: ProviderSpecificProperty holds the name and value of a configuration which is specific to individual DNS providers
                          properties:
                            name:
                              description: |-
                                Name of the provider-specific property. Accepted names are provider
                                dependent; see the tutorial for the provider in use.
                              maxLength: 253
                              minLength: 1
                              type: string
                            value:
                              description: Value of the provider-specific property.
                              maxLength: 4096
                              type: string
                          required:
                            - name
                          type: object
                        maxItems: 100
                        type: array
                      recordTTL:
                        description: |-
                          RecordTTL is the TTL of the record in seconds. 0 means "not set" and lets
                          the provider apply its own default. The upper bound is the RFC 2181 §8 maximum.
                        format: int64
                        maximum: 2147483647
                        minimum: 0
                        type: integer
                      recordType:
                        description: RecordType is the DNS record type.
                        enum:
                          - A
                          - AAAA
                          - CNAME
                          - TXT
                          - SRV
                          - NS
                          - PTR
                          - MX
                          - NAPTR
                        type: string
                      setIdentifier:
                        description: |-
                          SetIdentifier distinguishes multiple records with the same name and type
                          (e.g. Route53 records with routing policies other than 'simple').
                        maxLength: 255
                        type: string
                      targets:
                        description: |-
                          Targets are the values the DNS record points to. Leaving it empty is only
                          meaningful when --default-targets is configured.
                        items:
                          maxLength: 4096
                          minLength: 1
                          type: string
                        maxItems: 1000
                        type: array
                    required:
                      - dnsName
                      - recordType
                    type: object
                    x-kubernetes-validations:
                      - message: SRV targets must be '<priority> <weight> <port> <host>' with an absolute host, e.g. '10 5 5060 sip.example.com.'
                        rule: self.recordType != 'SRV' || !has(self.targets) || self.targets.all(t, t.endsWith('.'))
                      - message: NAPTR targets must be absolute and end with a dot
                        rule: self.recordType != 'NAPTR' || !has(self.targets) || self.targets.all(t, t.endsWith('.'))
                      - message: PTR dnsName must be a reverse DNS name under .in-addr.arpa or .ip6.arpa, written without a trailing dot, e.g. '1.0.0.10.in-addr.arpa'
                        rule: self.recordType != 'PTR' || self.dnsName.lowerAscii().endsWith('.in-addr.arpa') || self.dnsName.lowerAscii().endsWith('.ip6.arpa')
                  maxItems: 1000
                  type: array
              type: object
            status:
              description: DNSEndpointStatus defines the observed state of DNSEndpoint
              properties:
                observedGeneration:
                  description: The generation observed by the external-dns controller.
                  format: int64
                  type: integer
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
